    project management.
  humanURL: https://developer.trimble.com/docs/projectsight
  tags:
  - Construction
  - Project Management
  - Documents
  properties:
  - type: Documentation
    url: https://developer.trimble.com/docs/projectsight
- aid: trimble:trimble-truckmate
  name: TruckMate API
  description: >-
    The TruckMate REST API provides transactional and configuration operations for Trimble's transportation
    management system (TMS). Enables freight brokers, carriers, and logistics operators to automate dispatch,
    load management, and billing workflows.
  humanURL: https://developer.trimble.com/docs/truckmate
  tags:
  - Transportation
  - TMS
  - Logistics
  - Freight
  properties:
  - type: Documentation
    url: https://developer.trimble.com/docs/truckmate
- aid: trimble:trimble-copilot
  name: CoPilot Navigation API
  description: >-
    The Trimble CoPilot Navigation API enables in-cab navigation integration with cloud-based services
    for commercial vehicle fleets. Provides route delivery, real-time traffic, and truck-specific navigation
    for driver mobile applications.
  humanURL: https://developer.trimble.com/docs/copilot
  tags:
  - Navigation
  - Transportation
  - Trucking
  - In-Cab
  properties:
  - type: Documentation
    url: https://developer.trimble.com/docs/copilot
  - type: DeveloperPortal
    url: https://developer.trimblemaps.com/copilot-navigation/
- aid: trimble:trimble-tmt
  name: TMT Fleet Maintenance API
  description: >-
    The TMT (Trimble Maintenance Technology) REST API provides fleet maintenance management operations
    for commercial vehicle fleets. Enables work order management, preventive maintenance scheduling, parts
    inventory, and repair tracking.
  humanURL: https://developer.trimble.com/docs/tmt
  tags:
  - Fleet Management
  - Maintenance
  - Transportation
  properties:
