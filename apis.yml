aid: trimble
name: Trimble
description: >-
  Trimble Inc. is a global technology company that provides advanced positioning, navigation, and data analytics
  solutions across construction, agriculture, transportation, and geospatial industries. Founded in 1978 as Trimble
  Navigation Limited, the company integrates GPS, laser, optical, and inertial technologies with software and services.
  Trimble's developer platform spans construction collaboration (Trimble Connect), commercial vehicle routing (PC*MILER,
  Trimble Maps), building information modeling (Tekla, SketchUp), fleet management (TruckMate, TMT, CoPilot), precision
  positioning (Mobile Manager, TAP Store), and construction ERP (Viewpoint). Publicly traded on NASDAQ as TRMB.
type: Index
