apis:
- aid: trimble:trimble-pcmiler
  name: Trimble PC*MILER API
  description: >-
    PC*MILER provides commercial vehicle routing and distance calculation APIs for logistics, freight,
    and transportation management. Delivers mileage, routing, tolls, and fuel optimization for trucking
    operations across North America, Europe, and global markets.
  humanURL: https://developer.trimble.com/docs/pc-miler
  tags:
  - Transportation
  - Routing
  - Logistics
  - Distance Calculation
  - Commercial Vehicles
  properties:
  - type: Documentation
    url: https://developer.trimble.com/docs/pc-miler
- aid: trimble:trimble-tekla
  name: Tekla API
  description: >-
    The Tekla API provides programmatic access to Tekla Structures, a leading Building Information Modeling
    (BIM) software for structural engineering and detailing. Enables custom model creation, data extraction,
    and workflow automation for steel, concrete, and timber construction.
  humanURL: https://developer.tekla.com/
  tags:
  - BIM
  - Structural Engineering
  - Construction
  - Modeling
  properties:
  - type: Documentation
    url: https://developer.tekla.com/
  - type: DeveloperPortal
    url: https://developer.tekla.com/
- aid: trimble:trimble-sketchup
  name: SketchUp API
  description: >-
    The SketchUp API enables extension development for Trimble SketchUp, a widely-used 3D modeling and
    design tool. Supports Ruby and JavaScript APIs for building custom tools, plugins, and integrations
    for architecture, interior design, and engineering workflows.
  humanURL: https://developer.sketchup.com/
  tags:
  - 3D Modeling
  - Architecture
  - Design
  - Plugins
  properties:
  - type: Documentation
    url: https://developer.sketchup.com/
- aid: trimble:trimble-projectsight
  name: ProjectSight API
  description: >-
